<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 68 68" width="68" height="68">
  <defs>
    <circle id="f" cx="25" cy="25" r="20"/>
    <circle id="b" cx="46" cy="46" r="10"/>
    <mask id="ext" maskUnits="userSpaceOnUse" x="0" y="0" width="68" height="68">
      <rect width="68" height="68" fill="#fff"/>
      <use xlink:href="#f" href="#f" fill="#000" stroke="#000" stroke-width="3"/>
      <circle cx="46" cy="46" r="17" fill="#000"/>
    </mask>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="68" height="68">
      <rect width="68" height="68" fill="#fff"/>
      <ellipse cx="25" cy="25" rx="8.5" ry="20" fill="none" stroke="#000" stroke-width="3.5"/>
      <line x1="3" y1="25" x2="47" y2="25" stroke="#000" stroke-width="3.5"/>
      <line x1="7" y1="14" x2="43" y2="14" stroke="#000" stroke-width="3"/>
      <line x1="7" y1="36" x2="43" y2="36" stroke="#000" stroke-width="3"/>
      <circle cx="46" cy="46" r="17" fill="#000"/>
    </mask>
    <mask id="bext" maskUnits="userSpaceOnUse" x="0" y="0" width="68" height="68">
      <rect width="68" height="68" fill="#fff"/>
      <use xlink:href="#b" href="#b" fill="#000" stroke="#000" stroke-width="3"/>
    </mask>
    <mask id="arrow" maskUnits="userSpaceOnUse" x="0" y="0" width="68" height="68">
      <rect width="68" height="68" fill="#fff"/>
      <polygon points="40,44 46,44 46,39 53,46 46,53 46,48 40,48" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#ext)" fill="#03b6cc">
    <use xlink:href="#f" href="#f" transform="translate(1 1)"/>
    <use xlink:href="#f" href="#f" transform="translate(2 2)"/>
    <use xlink:href="#f" href="#f" transform="translate(3 3)"/>
    <use xlink:href="#f" href="#f" transform="translate(4 4)"/>
    <use xlink:href="#f" href="#f" transform="translate(5 5)"/>
    <use xlink:href="#f" href="#f" transform="translate(6 6)"/>
    <use xlink:href="#f" href="#f" transform="translate(7 7)"/>
    <use xlink:href="#f" href="#f" transform="translate(8 8)"/>
  </g>
  <use xlink:href="#f" href="#f" fill="#03b6cc" mask="url(#cut)"/>
  <g mask="url(#bext)" fill="#03b6cc">
    <use xlink:href="#b" href="#b" transform="translate(1 1)"/>
    <use xlink:href="#b" href="#b" transform="translate(2 2)"/>
    <use xlink:href="#b" href="#b" transform="translate(3 3)"/>
    <use xlink:href="#b" href="#b" transform="translate(4 4)"/>
    <use xlink:href="#b" href="#b" transform="translate(5 5)"/>
  </g>
  <use xlink:href="#b" href="#b" fill="#03b6cc" mask="url(#arrow)"/>
</svg>
